[package]
name = "twentyonex-credentials"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "twentyonex-credential-key"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
zeroize = "=1.8.2"
base64 = "=0.22.1"
