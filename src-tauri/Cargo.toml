[package]
name = "twentyonex-tauri-feasibility"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false

[workspace]
members = ["engine", "credentials"]
resolver = "2"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.53.2", features = ["io-util", "macros", "process", "rt", "sync", "time"] }

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }
sha2 = "=0.10.9"
serde_json.workspace = true

[dependencies]
tauri = { version = "=2.12.3", features = [] }
raw-window-handle = { version = "=0.6.2", optional = true }
serde_json.workspace = true
twentyonex-engine = { path = "engine" }
sha2 = { version = "=0.10.9", optional = true }
tauri-plugin-opener = { version = "=2.5.4", optional = true }
tokio = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "=0.18.2", optional = true }
tauri-plugin-single-instance = { version = "=2.5.4", default-features = false, optional = true }

[target.'cfg(target_os = "linux")'.dev-dependencies]
tauri = { version = "=2.12.3", features = ["test"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
synthetic-desktop = ["twentyonex-engine/synthetic-desktop"]
artifact-authorization-proof = ["synthetic-desktop"]
synthetic-agent = ["synthetic-desktop", "twentyonex-engine/synthetic-agent"]
production-service = ["tauri/tray-icon", "twentyonex-engine/production-service", "dep:raw-window-handle", "dep:sha2", "dep:tauri-plugin-opener", "dep:tauri-plugin-single-instance", "dep:tokio", "dep:gtk"]
