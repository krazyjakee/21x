[package]
name = "twentyonex-tauri-feasibility"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[dependencies]
tauri = { version = "=2.12.3", features = [] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.53.2", features = ["io-util", "macros", "process", "rt", "sync", "time"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
