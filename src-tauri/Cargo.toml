[package]
name = "twentyonex-tauri-feasibility"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false

[workspace]
members = ["engine", "credentials"]
resolver = "2"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.53.2", features = ["io-util", "macros", "process", "rt", "sync", "time"] }

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[dependencies]
tauri = { version = "=2.12.3", features = [] }
serde_json.workspace = true
twentyonex-engine = { path = "engine" }

[features]
custom-protocol = ["tauri/custom-protocol"]
synthetic-desktop = ["twentyonex-engine/synthetic-desktop"]
