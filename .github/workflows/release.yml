name: Release

# Releases are manual and unsigned (issue #26): push a v* tag, or run this
# workflow by hand with the tag to build. There is no auto-tagging on version
# bumps, and no Apple or Windows signing secrets are needed. See README,
# "Releases".
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and release (e.g. v1.2.3)'
        required: true

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build-mac:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-14

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build app
        run: pnpm build

      - name: Package for macOS (unsigned, ad-hoc signature)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm exec electron-builder --config ./scripts/electron-builder-ci-mac-config.js --mac --${{ matrix.arch }} --publish never -c.mac.sign=./scripts/adhoc-sign-mac.js

      - name: Resolve mac artifacts
        id: mac-artifacts
        run: |
          APP_PATH="$(find dist -maxdepth 2 -type d -name '21x.app' | head -n 1)"
          ZIP_PATH="$(find dist -maxdepth 1 -type f -name '21x-*-${{ matrix.arch }}.zip' | head -n 1)"
          DMG_PATH="$(find dist -maxdepth 1 -type f -name '21x-*-${{ matrix.arch }}.dmg' | head -n 1)"

          test -n "$APP_PATH"
          test -f "$ZIP_PATH"
          test -f "$DMG_PATH"

          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"
          echo "zip_path=$ZIP_PATH" >> "$GITHUB_OUTPUT"
          echo "dmg_path=$DMG_PATH" >> "$GITHUB_OUTPUT"

      - name: Inspect packaged outputs
        run: |
          ls -lah dist
          ls -lah "${{ steps.mac-artifacts.outputs.app_path }}"
          echo "ZIP: ${{ steps.mac-artifacts.outputs.zip_path }}"
          echo "DMG: ${{ steps.mac-artifacts.outputs.dmg_path }}"

      - name: Rename arch-specific update manifest
        run: cp dist/latest-mac.yml dist/latest-mac-${{ matrix.arch }}.yml

      - name: Create stable asset names
        run: |
          cp dist/21x-*-${{ matrix.arch }}.dmg dist/21x-mac-${{ matrix.arch }}.dmg
          cp dist/21x-*-${{ matrix.arch }}.zip dist/21x-mac-${{ matrix.arch }}.zip

      - name: Upload release assets directly
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap

      - name: Upload manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: manifest-mac-${{ matrix.arch }}
          path: dist/latest-mac-${{ matrix.arch }}.yml

  build-windows:
    # Pinned to windows-2022: windows-latest ships Visual Studio 18 (VS 2026),
    # which the bundled node-gyp 11.5.0 can't detect, breaking the from-source
    # rebuild of better-sqlite3. windows-2022 has VS 2022 + the C++ workload.
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build app
        run: pnpm build

      - name: Package for Windows (unsigned)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm exec electron-builder --win --x64 --publish never

      - name: Create stable asset names
        run: cp dist/*.exe dist/21x-windows-x64.exe

      - name: Upload release assets directly
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            dist/*.exe
            dist/*.blockmap

      - name: Upload manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: manifest-windows-x64
          path: dist/latest.yml

  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Supply-chain controls (issue #18, docs/connectors-security.md). Run once,
      # on Linux: the dependency tree is the same for every platform.
      - name: Check connector pieces (allowlist, pins, licenses)
        run: node scripts/check-connector-pieces.mjs

      - name: Audit production dependencies
        run: pnpm audit --prod

      - name: Verify npm registry signatures and provenance
        run: npm audit signatures

      - name: Generate CycloneDX SBOM
        run: pnpm dlx @cyclonedx/cdxgen@11 -t js --required-only --no-install-deps -o sbom.cdx.json .

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json

      - name: Build app
        run: pnpm build

      - name: Package for Linux
        run: pnpm exec electron-builder --linux --x64 --publish never

      - name: Create stable asset names
        run: cp dist/*.AppImage dist/21x-linux-x86_64.AppImage

      - name: Upload release assets directly
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: dist/*.AppImage

      - name: Upload manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: manifest-linux-x64
          path: dist/latest-linux.yml

  publish-manifests:
    needs: [build-mac, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download manifest artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: manifest-*
          path: manifests
          merge-multiple: true

      - name: Merge mac update manifests
        working-directory: manifests
        run: |
          # Combine arm64 + x64 latest-mac manifests into one latest-mac.yml
          if [ -f latest-mac-arm64.yml ] && [ -f latest-mac-x64.yml ]; then
            python3 << 'EOF'
          import re

          def get_files_block(text):
              """Extract indented file entries from under 'files:' key."""
              m = re.search(r"^files:\n((?:  .+\n)+)", text, re.MULTILINE)
              return m.group(1) if m else ""

          arm64 = open("latest-mac-arm64.yml").read()
          x64 = open("latest-mac-x64.yml").read()
          x64_files = get_files_block(x64)

          # Append x64 file entries into arm64's files block
          merged = re.sub(
              r"(^files:\n(?:  .+\n)+)",
              lambda m: m.group(0) + x64_files,
              arm64, count=1, flags=re.MULTILINE
          )
          open("latest-mac.yml", "w").write(merged)
          print("Merged latest-mac.yml")
          EOF
            rm -f latest-mac-arm64.yml latest-mac-x64.yml
          elif [ -f latest-mac-arm64.yml ]; then
            mv latest-mac-arm64.yml latest-mac.yml
          elif [ -f latest-mac-x64.yml ]; then
            mv latest-mac-x64.yml latest-mac.yml
          fi
          echo "--- latest-mac.yml ---"
          cat latest-mac.yml

      - name: Upload manifests to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: manifests/*.yml
          generate_release_notes: true
