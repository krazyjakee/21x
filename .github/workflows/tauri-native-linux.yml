name: Tauri native Linux feasibility

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Isolated native proof to execute
        required: true
        default: feasibility
        type: choice
        options:
          - feasibility
          - synthetic-desktop
          - artifact-authorization-proof
          - synthetic-agent

permissions:
  contents: read

concurrency:
  group: tauri-native-linux
  cancel-in-progress: false

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      MAKEFLAGS: '-j1'
      npm_package_config_node_gyp_jobs: '1'
      HUSKY: '0'
      TAURI_NATIVE_PROOF_MODE: ${{ inputs.mode || 'feasibility' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: pnpm
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --no-self-update && rustup default 1.98.0
      - name: Install official Tauri Linux prerequisites and display tooling
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev xvfb xauth dbus-x11
      - name: Cache compressed Cargo dependencies only
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: tauri-native-linux-archives-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
      - name: Prepare evidence directory and platform versions
        run: |
          mkdir -p native-evidence
          git rev-parse HEAD > native-evidence/commit.txt
          rustc --version > native-evidence/rust.txt
          node --version > native-evidence/node.txt
          pkg-config --modversion gtk+-3.0 webkit2gtk-4.1 librsvg-2.0 > native-evidence/webview-libraries.txt
      - name: Install JavaScript tooling without Electron native lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Stage the standalone Node runtime and native addons once
        run: pnpm tauri:prepare:native 2>&1 | tee native-evidence/native-staging.log
      - name: Run portable unit tests under staged standalone Node
        run: |
          pnpm test:tauri -- --silent --reporter=json --outputFile=native-evidence/standalone-tests.json
          test -s native-evidence/standalone-tests.json
          node -e 'const report = require("./native-evidence/standalone-tests.json"); if (!report.success || report.numFailedTests) process.exit(1)'
      - name: Stage the synthetic database service and check its actual native boundary
        if: inputs.mode != 'feasibility'
        run: |
          pnpm tauri:prepare:database | tee native-evidence/database-staging.json
          TAURI_NODE_RUNTIME="$PWD/src-tauri/resources/node/node" TAURI_DATABASE_SERVICE_ENTRY="$PWD/src-tauri/resources/service/database-stdio.mjs" "$PWD/src-tauri/resources/node/node" scripts/transcript-page-proof.mjs | tee native-evidence/transcript-page-proof.json
          TAURI_NODE_RUNTIME="$PWD/src-tauri/resources/node/node" TAURI_DATABASE_SERVICE_ENTRY="$PWD/src-tauri/resources/service/database-stdio.mjs" "$PWD/src-tauri/resources/node/node" scripts/configuration-service-proof.mjs | tee native-evidence/configuration-service-proof.json
          if [ "$TAURI_NATIVE_PROOF_MODE" = 'synthetic-agent' ]; then
            TAURI_SQLITE_MODULE="$PWD/src-tauri/resources/service/node_modules/better-sqlite3" node scripts/agent-desktop-proof.mjs | tee native-evidence/agent-desktop-proof.json
            TAURI_NODE_RUNTIME="$PWD/src-tauri/resources/node/node" TAURI_DATABASE_SERVICE_ENTRY="$PWD/src-tauri/resources/service/database-stdio.mjs" node scripts/agent-service-proof.mjs | tee native-evidence/agent-service-proof.json
          fi
          export TWENTYONEX_TEST_RESOURCES="$PWD/src-tauri/resources"
          native_features=synthetic-desktop
          if [ "$TAURI_NATIVE_PROOF_MODE" = 'synthetic-agent' ]; then native_features=synthetic-agent; fi
          cargo test --locked --manifest-path src-tauri/Cargo.toml -p twentyonex-engine --features "$native_features" -- --test-threads=1 2>&1 | tee native-evidence/database-native-unit.log
          cargo test --locked --manifest-path src-tauri/Cargo.toml -p twentyonex-engine --features synthetic-desktop -- --ignored staged_synthetic_database_roundtrip_emits_real_target_events --test-threads=1 2>&1 | tee native-evidence/database-native-roundtrip.log
          cargo test --locked --manifest-path src-tauri/Cargo.toml -p twentyonex-engine --features synthetic-desktop -- --ignored staged_synthetic_configuration_roundtrip_preserves_real_content_effects --test-threads=1 2>&1 | tee native-evidence/configuration-native-roundtrip.log
      - name: Build the native host and Debian package
        run: |
          feature_args=()
          if [ "$TAURI_NATIVE_PROOF_MODE" = 'synthetic-desktop' ]; then
            feature_args=(--features synthetic-desktop)
          elif [ "$TAURI_NATIVE_PROOF_MODE" = 'synthetic-agent' ]; then
            feature_args=(--features synthetic-agent)
          elif [ "$TAURI_NATIVE_PROOF_MODE" = 'artifact-authorization-proof' ]; then
            feature_args=(--features artifact-authorization-proof)
          elif [ "$TAURI_NATIVE_PROOF_MODE" != 'feasibility' ]; then
            exit 2
          fi
          pnpm tauri:build --debug --bundles deb "${feature_args[@]}" -- --locked 2>&1 | tee native-evidence/native-build.log
      - name: Exercise the headless native runtime separately from the GUI
        run: cargo run --locked --manifest-path src-tauri/Cargo.toml -p twentyonex-engine --example probe -- src-tauri/resources 2>native-evidence/headless-probe.log | tee native-evidence/headless-probe.json
      - name: Install the actual Debian package
        run: |
          packages=(src-tauri/target/debug/bundle/deb/*.deb)
          test "${#packages[@]}" -eq 1
          sha256sum "${packages[0]}" > native-evidence/package-sha256.txt
          dpkg-deb --field "${packages[0]}" Package Version Architecture > native-evidence/package-info.txt
          sudo dpkg --install "${packages[0]}" 2>&1 | tee native-evidence/package-install.log
          test -x /usr/bin/twentyonex-tauri-feasibility
      - name: Launch the installed GUI with bundled Node, probe and close gracefully
        timeout-minutes: 3
        run: |
          mkdir -p "$RUNNER_TEMP/tauri-smoke/data" "$RUNNER_TEMP/tauri-smoke/config" "$RUNNER_TEMP/tauri-smoke/cache" "$RUNNER_TEMP/tauri-smoke/runtime"
          chmod 700 "$RUNNER_TEMP/tauri-smoke/runtime"
          test ! -e /nonexistent
          timeout --signal=TERM --kill-after=5s 90s dbus-run-session -- xvfb-run --auto-servernum --server-args='-screen 0 1280x720x24' /usr/bin/env \
            PATH=/nonexistent \
            XDG_DATA_HOME="$RUNNER_TEMP/tauri-smoke/data" \
            XDG_CONFIG_HOME="$RUNNER_TEMP/tauri-smoke/config" \
            XDG_CACHE_HOME="$RUNNER_TEMP/tauri-smoke/cache" \
            XDG_RUNTIME_DIR="$RUNNER_TEMP/tauri-smoke/runtime" \
            WEBKIT_DISABLE_COMPOSITING_MODE=1 \
            TWENTYONEX_NATIVE_SMOKE_REPORT="$PWD/native-evidence/installed-gui-smoke.json" \
            /usr/bin/twentyonex-tauri-feasibility 2>&1 | tee native-evidence/installed-gui-smoke.log
      - name: Verify GUI evidence, installed resources and absence of an orphaned service
        run: |
          python3 - <<'PY'
          import json
          import os
          import importlib.util
          import sys
          from pathlib import Path
          sys.dont_write_bytecode = True
          spec = importlib.util.spec_from_file_location('packaged_smoke', 'scripts/tauri-packaged-smoke.py')
          packaged_smoke = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(packaged_smoke)
          report_path = Path('native-evidence/installed-gui-smoke.json')
          report = json.loads(report_path.read_text())
          assert report['stage'] == 'complete' and report['passed'] is True
          runtime = report['runtime']
          assert runtime['initialized'] is True
          assert runtime['developmentFrontend'] is False
          assert runtime['systemNodeHidden'] is True
          if runtime.get('syntheticDesktop') is True:
              proof = runtime['syntheticDesktopProof']
              assert len(proof) == (20 if os.environ['TAURI_NATIVE_PROOF_MODE'] == 'synthetic-agent' else 13) and all(value is True for value in proof.values())
              assert runtime.get('syntheticAgent') is (os.environ['TAURI_NATIVE_PROOF_MODE'] == 'synthetic-agent')
              assert Path(runtime['profileRoot']).name.startswith('21x-database-service-')
              assert (Path(runtime['resourceRoot']) / 'service/database-stdio.mjs').is_file()
              assert (Path(runtime['resourceRoot']) / 'service/database-engine.mjs').is_file()
          else:
              assert runtime['nativeProbe']['ok'] is True
              assert runtime['profileRoot'].startswith(os.environ['RUNNER_TEMP'] + '/tauri-smoke/')
          if os.environ['TAURI_NATIVE_PROOF_MODE'] == 'artifact-authorization-proof':
              authority = runtime['artifactAuthorizationProof']
              assert authority['passed'] is True
              assert authority['boundary'] == 'separate-webview'
              assert authority['sameMainIframeIsolationProven'] is False
              packaged_smoke.verify_artifact_authority(authority)
          assert runtime['resourceRoot'].startswith('/usr/lib/')
          owned_node = packaged_smoke.verified_owned_node(runtime, Path(runtime['resourceRoot']).resolve())
          assert (Path(runtime['resourceRoot']) / 'service/feasibility.mjs').is_file()
          assert report['shutdown']['engineUnavailable'] is True
          assert report['shutdown']['ownedChildExited'] is True
          profile_marker = ('TWENTYONEX_PROFILE_ROOT=' + runtime['profileRoot']).encode()
          orphaned = []
          for process in Path('/proc').iterdir():
              if process.name.isdecimal():
                  try:
                      environment = (process / 'environ').read_bytes().split(b'\0')
                      executable = (process / 'exe').resolve(strict=True)
                  except (OSError, PermissionError):
                      continue
                  if profile_marker in environment or executable == owned_node:
                      orphaned.append(process.name)
          report['verification'] = {'installedResources': True, 'ownedRunningProcessesAfterExit': orphaned}
          report['verification']['runtimeVersions'] = packaged_smoke.runtime_versions(owned_node, runtime, 'x64')
          report_path.write_text(json.dumps(report, indent=2) + '\n')
          assert not orphaned, 'Owned staged Node process remained alive after native quit'
          print(json.dumps(report, indent=2))
          PY
      - name: Upload compact build and smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tauri-native-linux-evidence-${{ github.sha }}
          path: native-evidence/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
      - name: Upload the Debian package separately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tauri-native-linux-deb-${{ github.sha }}
          path: src-tauri/target/debug/bundle/deb/*.deb
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
