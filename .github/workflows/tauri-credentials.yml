name: Tauri native credential proof

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tauri-credential-proof
  cancel-in-progress: false

jobs:
  credentials:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x64
          - runner: macos-15-intel
            target: macos-x64
          - runner: macos-14
            target: macos-arm64
          - runner: windows-2022
            target: windows-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      HUSKY: '0'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: pnpm
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --no-self-update && rustup default 1.98.0
      - name: Install Linux Secret Service and Electron display prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libdbus-1-dev gnome-keyring libsecret-1-0 dbus-x11 xvfb xauth libgtk-3-0t64 libnss3 libasound2t64
      - name: Cache compressed Cargo dependency archives
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: tauri-credentials-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src-tauri/Cargo.lock') }}
      - name: Install tooling without lifecycle/native rebuilds, then official Electron binary
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          node node_modules/electron/install.js
      - name: Build the GTK-independent native key helper
        run: cargo build --locked --manifest-path src-tauri/Cargo.toml -p twentyonex-credentials --bin twentyonex-credential-key
      - name: Record source and tool versions
        run: |
          mkdir -p credential-evidence
          git rev-parse HEAD > credential-evidence/commit.txt
          node --version > credential-evidence/node.txt
          rustc --version > credential-evidence/rust.txt
      - name: Real isolated Secret Service unlocked, locked, unavailable and basic_text legacy proof
        if: runner.os == 'Linux'
        run: |
          helper="$PWD/src-tauri/target/debug/twentyonex-credential-key"
          electron_bin="$(node -p "require('electron')")"
          node scripts/credential-proof/linux-session.mjs --helper "$helper" --electron "$electron_bin" > credential-evidence/proof.json
      - name: Real macOS Keychain / Windows Credential Store and legacy safeStorage proof
        if: runner.os != 'Linux'
        run: |
          suffix=""
          if [ "$RUNNER_OS" = "Windows" ]; then suffix=".exe"; fi
          helper="$PWD/src-tauri/target/debug/twentyonex-credential-key$suffix"
          electron_bin="$(node -p "require('electron')")"
          node scripts/credential-proof/run.mjs --helper "$helper" --electron "$electron_bin" > credential-evidence/proof.json
      - name: Require actual OS proof success
        run: node -e "const p=require('./credential-evidence/proof.json'); if(p.passed!==true) process.exit(1)"
      - name: Upload metadata only (never keys, raw manifests, plaintext, or keyrings)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: credential-proof-${{ matrix.target }}
          path: credential-evidence/
          if-no-files-found: error
          retention-days: 14
