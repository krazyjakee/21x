name: Verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check connector pieces (allowlist, pins, licenses)
        run: node scripts/check-connector-pieces.mjs

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test:run

      - name: Navigation rail real-scrollport regression
        run: |
          # Hosted Linux needs Chromium's packaged SUID helper configured.
          electron_sandbox="$(node -p "require('node:path').join(require('node:path').dirname(require('electron')), 'chrome-sandbox')")"
          sudo chown root:root "$electron_sandbox"
          sudo chmod 4755 "$electron_sandbox"
          xvfb-run --auto-servernum pnpm test:nav-rail
