name: Verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check connector pieces (allowlist, pins, licenses)
        run: node scripts/check-connector-pieces.mjs

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Tauri inventory and contract freshness
        run: |
          node scripts/tauri-inventory.mjs --check
          node scripts/tauri-contracts.mjs --check

      - name: Build
        run: pnpm build

      - name: Build the isolated Tauri renderer
        run: pnpm tauri:frontend:build

      - name: Test
        run: pnpm test:run

      - name: Tauri foundation subprocess regressions
        run: pnpm test:tauri:spike

      - name: Tauri installed evidence policy regressions
        run: python scripts/tauri-packaged-smoke.test.py

      - name: Tauri headless supervisor regressions
        env:
          CARGO_BUILD_JOBS: '1'
        run: |
          cargo test --locked --manifest-path src-tauri/Cargo.toml -p twentyonex-engine -- --test-threads=1
          cargo test --locked --manifest-path src-tauri/Cargo.toml -p twentyonex-engine --features synthetic-agent -- --test-threads=1
          pnpm tauri:prepare:native
          pnpm tauri:prepare:connectors
          pnpm test:tauri -- --silent
          TWENTYONEX_TEST_RESOURCES="$PWD/src-tauri/resources" cargo test --locked --manifest-path src-tauri/Cargo.toml -p twentyonex-engine -- --ignored --test-threads=1

      - name: Navigation rail real-scrollport regression
        run: |
          # Hosted Linux needs Chromium's packaged SUID helper configured.
          electron_sandbox="$(node -p "require('node:path').join(require('node:path').dirname(require('electron')), 'chrome-sandbox')")"
          sudo chown root:root "$electron_sandbox"
          sudo chmod 4755 "$electron_sandbox"
          xvfb-run --auto-servernum pnpm test:nav-rail

      - name: Commander native keyboard and focus regression
        run: xvfb-run --auto-servernum pnpm test:commander-input
